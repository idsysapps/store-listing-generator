[project]
name = "store-listing-generator"
version = "0.1.0"
description = "Automated E-Commerce Apparel Trend Mining & Publishing System"
requires-python = ">=3.13"
dependencies = [
    "pytrends>=4.9.2",
    "urllib3<2",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "psycopg2-binary>=2.9.9",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "apify-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["**/__pycache__"]
reportMissingImports = true
reportMissingTypeStubs = false

[tool.hatch.build.targets.wheel]
packages = ["src/store_listing"]
