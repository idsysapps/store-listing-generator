# Test configuration
#
# The tests run against a real PostgreSQL, the way the production database
# runs: H2 cannot create the `text[]` and `jsonb` columns the entities
# declare, so the schema the tests worked with was not the schema the code
# expects (issue #181). The database is a container that the test resource
# starts, so nothing has to be installed to run the tests.
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.security.auth.enabled-in-dev-mode=false
mp.jwt.verify.issuer=https://costbook.com
smallrye.jwt.verify.algorithm=RS256
design.s3.bucket=test-bucket
