# Application
quarkus.application.name=trend-service
quarkus.http.port=8081

# Database - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USER:store_listing}
quarkus.datasource.password=${DATABASE_PASSWORD:store_listing}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:store_listing}
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# JWT / SmallRye JWT
# prod only: key location must be provided (chart mounts it at /etc/jwt). Dev/test use Quarkus auto-generated keys.
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLICKEY_LOCATION}
mp.jwt.verify.issuer=${JWT_ISSUER:https://costbook.example.com}
mp.jwt.verify.algorithm=RS256

# For development, allow unsigned tokens (disable in production)
%dev.mp.jwt.verify.publickey.location=
%dev.smallrye.jwt.verify.algorithm=RS256
%dev.quarkus.security.auth.enabled-in-dev-mode=false

# GraphQL
quarkus.smallrye-graphql.ui.enable=${GRAPHQL_UI_ENABLE:false}
quarkus.smallrye-graphql.schema-validation=false
quarkus.smallrye-graphql.features.SubscriptionSupport.enabled=true

# CORS - backend to backend only
quarkus.http.cors=true
quarkus.http.cors.origins=
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Health
quarkus.smallrye-health.ui.enable=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.trends".level=DEBUG
