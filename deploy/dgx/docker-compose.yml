services:
  vllm-briefs:
    image: ghcr.io/timothystewart6/vllm-gb10:v0.31.0-gb10.1
    container_name: vllm-briefs
    restart: unless-stopped
    ipc: host
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - SAFETENSORS_FAST_GPU=1
    command:
      - "vllm"
      - "serve"
      - "Qwen/Qwen3-14B"
      - "--host=0.0.0.0"
      - "--port=8002"
      - "--gpu-memory-utilization=0.25"
      - "--quantization=fp8_per_tensor"
      # A smaller context and batch keeps the profiling run (which is what
      # decides the KV cache size) well inside the budget.
      - "--max-model-len=16384"
      - "--max-num-seqs=2"
      - "--tensor-parallel-size=1"
      - "--dtype=bfloat16"
      - "--trust-remote-code"
      - "--enable-prefix-caching"
      - "--served-model-name=qwen38_briefs"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=hermes"
      - "--reasoning-parser=qwen3"
      # CUDA graph capture needs several GB on top of the weights, and the
      # capture is what pushed the first cold start over the budget. Eager mode
      # avoids it; this model runs in a daily batch, not on a latency path.
      - "--enforce-eager"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  vllm-vision:
    image: ghcr.io/timothystewart6/vllm-gb10:v0.31.0-gb10.1
    container_name: vllm-vision
    restart: unless-stopped
    ipc: host
    network_mode: host
    depends_on:
      vllm-briefs:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - SAFETENSORS_FAST_GPU=1
    command:
      - "vllm"
      - "serve"
      - "Qwen/Qwen2.5-VL-7B-Instruct"
      - "--host=0.0.0.0"
      - "--port=8003"
      # 15.7 GB of weights in bf16 plus the activation peak needs more than
      # 0.15 of the 122 GB device memory.
      - "--gpu-memory-utilization=0.30"
      # The OCR gate sends a single downscaled JPEG - 4k of context is ample
      # and keeps the profiling run small.
      - "--max-model-len=4096"
      - "--max-num-seqs=1"
      # Blackwell (sm_121) VL kernels are not reliably supported in fp8 - use bf16.
      - "--dtype=bfloat16"
      - "--trust-remote-code"
      # video:0 - without it vLLM profiles the video encoder at its maximum
      # feature size, which is the single largest memory spike in the startup.
      - "--limit-mm-per-prompt={\"image\":1,\"video\":0}"
      - "--served-model-name=qwen_vl_ocr"
      - "--enforce-eager"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  comfyui:
    image: comfyui-spark:latest
    container_name: comfyui
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s
    ipc: host
    network_mode: host
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      stack: 67108864
    depends_on:
      vllm-vision:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${COMFYUI_DATA_PATH:-/opt/comfyui-data}:/data
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - COMFYUI_ARGS=--disable-pinned-memory --use-pytorch-cross-attention --bf16-unet --bf16-vae --bf16-text-enc
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu130
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  openai-proxy:
    image: python:3.12-slim
    container_name: vllm-proxy
    restart: unless-stopped
    network_mode: host
    depends_on:
      vllm-briefs:
        condition: service_healthy
      vllm-vision:
        condition: service_healthy
    volumes:
      - ./openai-proxy.py:/app/proxy.py:ro
    command: ["python3", "/app/proxy.py"]

volumes:
  hf-cache:
