services:
  vllm:
    # One model for both jobs: the 27B writes the briefs and judges the
    # artwork. The two served names keep the existing proxy routes and app
    # config unchanged.
    image: ghcr.io/timothystewart6/vllm-gb10:v0.31.0-gb10.1
    container_name: vllm
    restart: unless-stopped
    ipc: host
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - SAFETENSORS_FAST_GPU=1
    command:
      - "vllm"
      - "serve"
      - "nvidia/Qwen3.8-27B-NVFP4"
      - "--host=0.0.0.0"
      - "--port=8003"
      # 21 GB of weights plus the KV cache and activations fit in 0.30 of
      # the 122 GB device memory, and leave the rest for ComfyUI.
      - "--gpu-memory-utilization=0.30"
      - "--max-model-len=16384"
      - "--max-num-seqs=2"
      - "--kv-cache-dtype=fp8_e4m3"
      - "--trust-remote-code"
      - "--enable-prefix-caching"
      # One model serves both names, so qwen38_briefs and qwen_vl_ocr keep
      # working without touching the app or Helm values.
      - "--served-model-name"
      - "qwen38_briefs"
      - "qwen_vl_ocr"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=hermes"
      - "--reasoning-parser=qwen3"
      # The vision gate sends one image at a time. Without this, vLLM
      # profiles the video encoder at its maximum feature size, which is the
      # largest memory spike in the startup.
      - "--limit-mm-per-prompt={\"image\":1,\"video\":0}"
      - "--enforce-eager"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  comfyui:
    image: comfyui-spark:latest
    container_name: comfyui
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s
    ipc: host
    network_mode: host
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      stack: 67108864
    depends_on:
      vllm:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${COMFYUI_DATA_PATH:-/opt/comfyui-data}:/data
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - COMFYUI_ARGS=--disable-pinned-memory --use-pytorch-cross-attention --bf16-unet --bf16-vae --bf16-text-enc
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu130
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  openai-proxy:
    image: python:3.12-slim
    container_name: vllm-proxy
    restart: unless-stopped
    network_mode: host
    depends_on:
      vllm:
        condition: service_healthy
    volumes:
      - ./openai-proxy.py:/app/proxy.py:ro
    command: ["python3", "/app/proxy.py"]

volumes:
  hf-cache:
