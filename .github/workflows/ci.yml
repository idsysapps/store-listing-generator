name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  push:
    branches: ['master']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    container: ubi9/python:3.13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv ruff check

      - name: Pyright type check
        run: uv pyright

      - name: Run tests
        run: uv pytest --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: store-listing-generator:latest
          load: true
          push: false
