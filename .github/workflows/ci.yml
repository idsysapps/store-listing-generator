name: CI

on:
  push:
    branches: ['master']
    tags: ['v*.*.*']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run --with ruff ruff check .

      - name: Pyright type check
        run: uv run --with pyright pyright

      - name: Run tests
        run: uv run --with pytest --with pytest-cov pytest --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build-only:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python app
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: quay.io/idsysapps/store-listing-generator:pr-test

      - name: Build trend-service
        uses: docker/build-push-action@v6
        with:
          context: ./trend-service
          dockerfile: Dockerfile
          push: false
          tags: quay.io/idsysapps/trend-service:pr-test

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "app_tag=v${VERSION}" >> $GITHUB_OUTPUT
            echo "trend_tag=v${VERSION}" >> $GITHUB_OUTPUT
            echo "push_tags=latest,v${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "app_tag=latest" >> $GITHUB_OUTPUT
            echo "trend_tag=latest" >> $GITHUB_OUTPUT
            echo "push_tags=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Python app
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            quay.io/idsysapps/store-listing-generator:latest
            quay.io/idsysapps/store-listing-generator:${{ steps.tags.outputs.app_tag }}

      - name: Build and push trend-service
        uses: docker/build-push-action@v6
        with:
          context: ./trend-service
          dockerfile: Dockerfile
          push: true
          tags: |
            quay.io/idsysapps/trend-service:latest
            quay.io/idsysapps/trend-service:${{ steps.tags.outputs.trend_tag }}

  helm-chart-publish:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.35.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Set version and image tag for master
        if: github.ref == 'refs/heads/master'
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "VERSION=0.1.0-master+sha${SHA}" >> $GITHUB_ENV
          echo "IMAGE_TAG=latest-sha${SHA}" >> $GITHUB_ENV
          echo "DEST_DIR=master" >> $GITHUB_ENV
          echo "COMMIT_MSG=chore: publish master chart 0.1.0-master+sha${SHA}" >> $GITHUB_ENV
          echo "IS_MASTER=true" >> $GITHUB_ENV

      - name: Set version and image tag for tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "IMAGE_TAG=v${VERSION}" >> $GITHUB_ENV
          echo "DEST_DIR=" >> $GITHUB_ENV
          echo "COMMIT_MSG=chore: release chart ${VERSION}" >> $GITHUB_ENV
          echo "IS_MASTER=false" >> $GITHUB_ENV

      - name: Get Docker digest for master builds
        if: github.ref == 'refs/heads/master'
        run: |
          DIGEST=$(docker inspect quay.io/idsysapps/store-listing-generator:latest --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "DIGEST=${DIGEST}" >> $GITHUB_ENV

      - name: Update Chart.yaml
        run: |
          yq e ".version = \"$VERSION\" | .appVersion = \"$IMAGE_TAG\"" \
            helm/store-listing/Chart.yaml > tmp.yaml && mv tmp.yaml helm/store-listing/Chart.yaml

      - name: Override image reference in values
        run: |
          if [[ "$IS_MASTER" == "true" ]]; then
            yq e ".app.image = \"quay.io/idsysapps/store-listing-generator@${DIGEST}\" | .trendService.image = \"quay.io/idsysapps/trend-service@${DIGEST}\"" \
              helm/store-listing/values.yaml > tmp.yaml && mv tmp.yaml helm/store-listing/values.yaml
          else
            yq e ".app.image = \"quay.io/idsysapps/store-listing-generator:${IMAGE_TAG}\" | .trendService.image = \"quay.io/idsysapps/trend-service:${IMAGE_TAG}\"" \
              helm/store-listing/values.yaml > tmp.yaml && mv tmp.yaml helm/store-listing/values.yaml
          fi

      - name: Package chart
        run: |
          mkdir -p /tmp/helm-repo
          helm package helm/store-listing/ --destination /tmp/helm-repo
          sync
          sleep 2

      - name: Prepare gh-pages directory
        run: |
          if [[ "$IS_MASTER" == "true" ]]; then
            mkdir -p /tmp/gh-pages/master
            rm -f /tmp/gh-pages/master/index.yaml
            helm repo index /tmp/helm-repo --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/master" > /tmp/gh-pages/master/index.yaml
            cp /tmp/helm-repo/*.tgz /tmp/gh-pages/master/
          else
            mkdir -p /tmp/gh-pages
            rm -f /tmp/gh-pages/index.yaml
            helm repo index /tmp/helm-repo --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}" > /tmp/gh-pages/index.yaml
            cp /tmp/helm-repo/*.tgz /tmp/gh-pages/
          fi
          wc -c /tmp/gh-pages/*/index.yaml /tmp/gh-pages/index.yaml 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/gh-pages
          commit_message: ${{ env.COMMIT_MSG }}

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/helm-repo/*.tgz
          generate_release_notes: true

      - name: Commit Chart.yaml back (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git add helm/store-listing/Chart.yaml
          git commit --amend --no-edit
          git push
