services:
  postgres:
    image: registry.access.redhat.com/ubi9/postgresql-16
    environment:
      POSTGRESQL_USER: store_listing
      POSTGRESQL_PASSWORD: store_listing
      POSTGRESQL_DATABASE: store_listing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data

  redis:
    image: registry.access.redhat.com/ubi9/redis-7
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: store_listing
      DATABASE_USER: store_listing
      DATABASE_PASSWORD: store_listing
      REDIS_URL: redis://redis:6379/0
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_ACTOR_TIKTOK_HASHTAG: ${APIFY_ACTOR_TIKTOK_HASHTAG:-}
      APIFY_ACTOR_PINTEREST: ${APIFY_ACTOR_PINTEREST:-}
      ETSY_SUGGEST_URL: ${ETSY_SUGGEST_URL:-}
      APIFY_ACTOR_X: ${APIFY_ACTOR_X:-}
      # Image generation runs on the DGX (ComfyUI + Flux Schnell).
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      COMFYUI_TIMEOUT_SECONDS: ${COMFYUI_TIMEOUT_SECONDS:-300}
      VISION_LLM_BASE_URL: ${VISION_LLM_BASE_URL:-}
      VISION_LLM_MODEL: ${VISION_LLM_MODEL:-qwen_vl_ocr}
      VISION_LLM_API_KEY: ${VISION_LLM_API_KEY:-}
      TEXT_MATCH_THRESHOLD: ${TEXT_MATCH_THRESHOLD:-0.85}
      MAX_TEXT_REGENERATION_ATTEMPTS: ${MAX_TEXT_REGENERATION_ATTEMPTS:-2}

  trend-service:
    build:
      context: ./trend-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: store_listing
      DATABASE_USER: store_listing
      DATABASE_PASSWORD: store_listing
      JWT_PUBLICKEY_LOCATION: ""
      QUARKUS_PROFILE: dev

volumes:
  postgres_data:
