services:
  postgres:
    image: registry.access.redhat.com/ubi9/postgresql-16
    environment:
      POSTGRESQL_USER: store_listing
      POSTGRESQL_PASSWORD: store_listing
      POSTGRESQL_DATABASE: store_listing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data

  redis:
    image: registry.access.redhat.com/ubi9/redis-7
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: store_listing
      DATABASE_USER: store_listing
      DATABASE_PASSWORD: store_listing
      REDIS_URL: redis://redis:6379/0
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_ACTOR_TIKTOK_HASHTAG: ${APIFY_ACTOR_TIKTOK_HASHTAG:-}
      APIFY_ACTOR_PINTEREST: ${APIFY_ACTOR_PINTEREST:-}
      ETSY_SUGGEST_URL: ${ETSY_SUGGEST_URL:-}
      APIFY_ACTOR_X: ${APIFY_ACTOR_X:-}

  trend-service:
    build:
      context: ./trend-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: store_listing
      DATABASE_USER: store_listing
      DATABASE_PASSWORD: store_listing
      JWT_PUBLICKEY_LOCATION: ""
      QUARKUS_PROFILE: dev

volumes:
  postgres_data:
