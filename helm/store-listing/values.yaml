createNamespace: true

config:
  databaseName: store_listing
  redisUrl: redis://store-listing-store-listing-redis:6379/0
  quarkusProfile: prod
  tiktokActorId: ""
  tiktokResultsPerPage: 20
  sourceHealthEnabled: true
  healthFailureThreshold: 2
  healthEmptyThreshold: 3
  githubRepo: ""
  pinterestActorId: ""
  xActorId: ""
  llmBaseUrl: "https://api.groq.com/openai/v1"
  llmModel: "llama-3.3-70b-versatile"
  llmCurationModel: ""
  llmSeedCurationEnabled: "false"
  llmMaxCandidates: "5"
  llmMaxTokens: "4096"
  # Six runs a day, after the 07:00 brief batch. An hourly curation kept the
  # 27B busy and overlapped the briefs (issue #286).
  llmCurationSchedule: "20 2,6,10,14,18,22 * * *"
  llmDesignBriefsEnabled: "false"
  llmMaxBriefs: "8"
  llmMaxBriefSeeds: "20"
  # Production turns the plan off; local experiments can keep it on to inspect
  # the carrier/region pass.
  llmTextPlan: "true"
  llmTextPlanRegenerate: "true"
  # The copy editor is a separate local-LLM pass that keeps, drops or
  # rewrites design text before an image is generated.
  llmCopyReview: "true"
  # The pricing pass chooses budget/standard/premium from the design's
  # confidence and the material/print cost. The code computes the price.
  llmPricingReview: "true"
  dtfPrintCostPerSqIn: "0.005"
  amazonReferralFeeRate: "0.15"
  pricingBudgetMargin: "0.30"
  pricingStandardMargin: "0.40"
  pricingPremiumMargin: "0.50"
  pricingBudgetFloor: "14.99"
  pricingStandardFloor: "19.99"
  pricingPremiumFloor: "24.99"
  pricing2xlUpcharge: "2.00"
  pricing3xlUpcharge: "3.00"
  pricingTargetDpi: "300"
  pricingCurrency: "USD"
  # The listing-copy pass writes the Amazon product description; the scene
  # description stays the image prompt.
  llmListingCopy: "true"
  # How long a concept stays in the store before the model may write it again.
  llmBriefConceptCooldownDays: "30"
  llmMaxActiveSeeds: "200"
  llmMinBriefableSeeds: "30"
  llmBriefSeedCooldownDays: "14"
  awsDefaultRegion: "us-west-2"
  s3EndpointUrl: ""
  designS3Bucket: "store-listing-designs"
  comfyuiBaseUrl: "http://comfyui:8188"
  comfyuiTimeoutSeconds: "300"
  comfyuiBgAlphaBlack: "24"
  comfyuiBgAlphaWhite: "240"
  comfyuiBgErodePixels: "1"
  # Flux Schnell is distilled for 4 steps at cfg 1.0. The step count is a
  # setting so a run can be tuned without a code change (issue #210).
  comfyuiSteps: "4"
  comfyuiCfg: "1.0"
  # The Qwen typographic hero path is slower than Flux, so it is opt-in.
  typographicHeroEnabled: "0"
  typographicHeroBriefIds: ""
  typographicHeroCandidates: "2"
  typographicHeroDescriptor: "1"
  # A "painted" text plan goes to Qwen-Image so the words live in the art
  # instead of being overlaid by the compositor (issue #133).
  modelTextEnabled: "0"
  # Qwen is the type_hero model. Letting a caption use it is an experiment,
  # not the default: it lost or garbled the headline on 5/9 captions in the
  # bake-off (issue #307).
  modelTextCaptionEnabled: "0"
  # Execute the brief's stored carrier/region/method plan. Off by default; the
  # deterministic compositor owns the default path (issue #307).
  textPlanRenderingEnabled: "0"
  # Render two candidates and upload the one the deterministic QA gate likes
  # best. Production sets 2; local runs default to one to save GPU time.
  imageCandidateCount: "1"
  # DTF-safe embedded type on planned carriers. Off by default; v11/v12 are
  # standard wear and v13 is heavy distress.
  textEmbedProfile: "off"
  visionLlmBaseUrl: ""
  visionLlmModel: "qwen_vl_ocr"
  artworkVisionModel: ""
  textMatchThreshold: "0.85"
  maxTextRegenerationAttempts: "2"
  maxArtworkRegenerationAttempts: "1"
  artworkValidationEnabled: "true"
  artworkTextValidationEnabled: "true"
  maxLetteringRegenerationAttempts: "1"
  requireTaglineText: "false"
  # The product types the pipeline produces right now. Empty means every
  # known type; a stored setting in app_settings wins over this value.
  enabledProductTypes: ""

secrets:
  databaseUser: store_listing
  databasePassword: store_listing
  jwtSecretName: ""
  jwtIssuer: https://costbook.com
  apifyApiToken: ""
  githubToken: ""
  youtubeApiKey: ""
  etsyApiKey: ""
  redditClientId: ""
  redditClientSecret: ""
  llmApiKey: ""
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  visionLlmApiKey: ""

postgres:
  image: registry.access.redhat.com/hi/postgresql:latest
  storage: 1Gi
  persistentVolumeClaim:
    create: true
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  image: registry.access.redhat.com/hi/valkey:latest
  storage: 1Gi
  persistentVolumeClaim:
    create: true
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

app:
  image: quay.io/idsysapps/store-listing-generator:latest
  replicas: 1
  # Celery beat is its own deployment so a second app replica cannot enqueue
  # the same Apify harvest twice.
  beatReplicas: 1
  # Celery forks one child per CPU by default, and the node reports enough
  # CPUs for 16 children. Each child holds about 125 MB of interpreter and
  # client state, so the worker was OOM-killed on the 2Gi limit (issue #272).
  celeryConcurrency: "4"
  # A child is replaced after this many tasks, so a long run does not grow.
  celeryMaxTasksPerChild: "25"
  resources:
    limits:
      cpu: 250m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi

trendService:
  image: quay.io/idsysapps/trend-service:latest
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
