createNamespace: true

config:
  databaseName: store_listing
  redisUrl: redis://store-listing-store-listing-redis:6379/0
  quarkusProfile: prod
  tiktokActorId: ""
  tiktokResultsPerPage: 20
  sourceHealthEnabled: true
  healthFailureThreshold: 2
  healthEmptyThreshold: 3
  githubRepo: ""
  pinterestActorId: ""
  xActorId: ""

secrets:
  databaseUser: store_listing
  databasePassword: store_listing
  jwtSecretName: ""
  jwtIssuer: https://costbook.example.com
  apifyApiToken: ""
  githubToken: ""
  youtubeApiKey: ""
  etsyApiKey: ""

postgres:
  image: registry.access.redhat.com/hi/postgresql:latest
  storage: 1Gi
  persistentVolumeClaim:
    create: true
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

redis:
  image: registry.access.redhat.com/hi/valkey:latest
  storage: 1Gi
  persistentVolumeClaim:
    create: true
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

app:
  image: quay.io/idsysapps/store-listing-generator:latest
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi

trendService:
  image: quay.io/idsysapps/trend-service:latest
  replicas: 1
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
