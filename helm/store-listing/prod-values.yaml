config:
  databaseName: store_listing
  redisUrl: redis://store-listing-store-listing-redis:6379/0
  quarkusProfile: prod
  # The DGX proxy serves these models (deploy/dgx/openai-proxy.py, MODEL_ROUTES).
  # A model the proxy does not route makes every brief and curation call fail
  # with a 404 (issue #194), so the names are checked against that file.
  llmBaseUrl: "http://192.168.6.202:9000/v1"
  llmModel: "qwen38_briefs"
  llmCurationModel: "qwen38_briefs"
  llmSeedCurationEnabled: "true"
  llmDesignBriefsEnabled: "true"
  llmCopyReview: "true"
  # The store focuses on DTF apparel for now. A stored setting in
  # app_settings wins over this value, so the scope can be changed without a
  # redeploy (issue #216).
  enabledProductTypes: "dtf_apparel"
  # Qwen draws the kicker and hero word for type_hero briefs. The path is
  # slower than Flux, but it is the only one that spells reliably.
  typographicHeroEnabled: "1"
  typographicHeroBriefIds: ""
  typographicHeroCandidates: "2"
  typographicHeroDescriptor: "1"
  # Production keeps the deterministic compositor until the embedded result is
  # approved; local values enable v11 for evaluation.
  textEmbedProfile: "off"
  # The bake-off showed one bad seed can leave the type on the subject or a
  # 65%-coverage plate. Two candidates plus the QA gate picks the clean one
  # (issue #307).
  imageCandidateCount: "2"
  # The renderer no longer executes the carrier/region/method plan, so
  # generating it is wasted work and can put a blank carrier in the scene.
  llmTextPlan: "false"
  # Captions stay on the deterministic compositor; Qwen is for type_hero.
  modelTextCaptionEnabled: "0"
  textPlanRenderingEnabled: "0"

secrets:
  databaseUser: store_listing
  databasePassword: ""
  jwtPublicKey: ""
  jwtSecretName: store-listing-jwt
  jwtIssuer: https://costbook.example.com

postgres:
  storage: 5Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

redis:
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

app:
  replicas: 2
  beatReplicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

trendService:
  replicas: 2
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
