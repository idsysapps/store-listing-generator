config:
  databaseName: store_listing
  redisUrl: redis://store-listing-store-listing-redis:6379/0
  quarkusProfile: prod

secrets:
  databaseUser: store_listing
  databasePassword: ""
  jwtPublicKeyLocation: ""
  jwtIssuer: https://costbook.example.com

postgres:
  storage: 5Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

redis:
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

app:
  replicas: 2
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

trendService:
  replicas: 2
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
