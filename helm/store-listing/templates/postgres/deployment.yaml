apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store-listing.postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "store-listing.postgres.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "store-listing.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
        app.kubernetes.io/name: {{ include "store-listing.postgres.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: POSTGRESQL_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.config.databaseName }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-data
          {{- if .Values.postgres.persistentVolumeClaim.create }}
          persistentVolumeClaim:
            claimName: {{ include "store-listing.postgres.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: schema
          configMap:
            name: {{ include "store-listing.fullname" . }}-schema
