apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store-listing.postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "store-listing.postgres.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "store-listing.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
        app.kubernetes.io/name: {{ include "store-listing.postgres.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: init-db
          image: {{ .Values.postgres.image }}
          env:
            - name: PGDATABASE
              value: {{ .Values.config.databaseName }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: POSTGRESQL_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: POSTGRESQL_PASSWORD
          command:
            - sh
            - -c
            - |
              psql -h $(DATABASE_HOST) -U $(PGUSER) -d postgres -c "CREATE DATABASE {{ .Values.config.databaseName }};" || true
              psql -h $(DATABASE_HOST) -U $(PGUSER) -d {{ .Values.config.databaseName }} -f /tmp/schema.sql
          env:
            - name: DATABASE_HOST
              value: {{ include "store-listing.postgres.fullname" . }}
          volumeMounts:
            - name: schema
              mountPath: /tmp/schema.sql
              subPath: schema.sql
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              value: {{ .Values.config.databaseName }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/pgsql/data
            - name: schema
              mountPath: /tmp/schema.sql
              subPath: schema.sql
      volumes:
        - name: postgres-data
          {{- if .Values.postgres.persistentVolumeClaim.create }}
          persistentVolumeClaim:
            claimName: {{ include "store-listing.postgres.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: schema
          configMap:
            name: {{ include "store-listing.fullname" . }}-schema
