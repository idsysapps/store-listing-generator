apiVersion: v1
kind: Service
metadata:
  name: {{ include "store-listing.postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "store-listing.postgres.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
