kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "store-listing.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ include "store-listing.postgres.fullname" . }}
  DATABASE_PORT: "5432"
  DATABASE_NAME: {{ .Values.config.databaseName }}
  REDIS_URL: {{ .Values.config.redisUrl }}
  QUARKUS_PROFILE: {{ .Values.config.quarkusProfile }}
  GRAPHQL_UI_ENABLED: "false"
  LLM_BASE_URL: {{ .Values.config.llmBaseUrl | default "https://api.groq.com/openai/v1" | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | default "llama-3.3-70b-versatile" | quote }}
  LLM_CURATION_MODEL: {{ .Values.config.llmCurationModel | default "" | quote }}
  LLM_SEED_CURATION_ENABLED: {{ .Values.config.llmSeedCurationEnabled | default "false" | quote }}
  LLM_MAX_CANDIDATES: {{ .Values.config.llmMaxCandidates | default "10" | quote }}
  LLM_MAX_TOKENS: {{ .Values.config.llmMaxTokens | default "8192" | quote }}
  LLM_DESIGN_BRIEFS_ENABLED: {{ .Values.config.llmDesignBriefsEnabled | default "false" | quote }}
  LLM_MAX_BRIEFS: {{ .Values.config.llmMaxBriefs | default "8" | quote }}
  LLM_MAX_BRIEF_SEEDS: {{ .Values.config.llmMaxBriefSeeds | default "20" | quote }}
  LLM_MAX_ACTIVE_SEEDS: {{ .Values.config.llmMaxActiveSeeds | default "200" | quote }}
  LLM_MIN_BRIEFABLE_SEEDS: {{ .Values.config.llmMinBriefableSeeds | default "30" | quote }}
  LLM_BRIEF_SEED_COOLDOWN_DAYS: {{ .Values.config.llmBriefSeedCooldownDays | default "14" | quote }}
  LLM_CURATION_SCHEDULE: {{ .Values.config.llmCurationSchedule | default "50 2,6,10,14,18,22 * * *" | quote }}
  LLM_CURATION_MAX_CHAIN: {{ .Values.config.llmCurationMaxChain | default "10" | quote }}
  LLM_CURATION_CHAIN_DELAY: {{ .Values.config.llmCurationChainDelay | default "10" | quote }}
  LLM_BRIEFS_SCHEDULE: {{ .Values.config.llmBriefsSchedule | default "0 7 * * *" | quote }}
  LLM_IMAGE_GEN_SCHEDULE: {{ .Values.config.llmImageGenSchedule | default "30 7 * * *" | quote }}
  LLM_RERANK_SCHEDULE: {{ .Values.config.llmRerankSchedule | default "0 8 * * *" | quote }}
  {{- if .Values.config.enabledProductTypes }}
  ENABLED_PRODUCT_TYPES: {{ .Values.config.enabledProductTypes | quote }}
  {{- end }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "store-listing.fullname" . }}-schema
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
data:
  schema.sql: |
    -- Table: trend_queries
    -- Stores the seed keywords and generated search queries, tagged with the
    -- ingester `source` (google/tiktok/pinterest/amazon/etsy)
    CREATE TABLE IF NOT EXISTS trend_queries (
        id SERIAL PRIMARY KEY,
        seed_keyword VARCHAR(255) NOT NULL,
        query VARCHAR(500) NOT NULL,
        source VARCHAR(20) NOT NULL DEFAULT 'google',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(seed_keyword, query)
    );

    -- Table: trend_scores
    -- Stores trend scores, deltas, and regional data for each query,
    -- tagged with the ingester `source` (google/tiktok/pinterest/amazon)
    CREATE TABLE IF NOT EXISTS trend_scores (
        id SERIAL PRIMARY KEY,
        query_id INTEGER NOT NULL REFERENCES trend_queries(id) ON DELETE CASCADE,
        score BIGINT NOT NULL,
        delta BIGINT DEFAULT 0,
        region VARCHAR(255) DEFAULT 'US',
        query_type VARCHAR(10) DEFAULT 'interest',
        source VARCHAR(20) NOT NULL DEFAULT 'google',
        trend_direction INTEGER,
        fetched_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Indexes for efficient querying
    CREATE INDEX IF NOT EXISTS idx_trend_scores_query_id ON trend_scores(query_id);
    CREATE INDEX IF NOT EXISTS idx_trend_scores_fetched_at ON trend_scores(fetched_at);
    CREATE INDEX IF NOT EXISTS idx_trend_queries_seed ON trend_queries(seed_keyword);

    -- Table: seed_candidates
    -- Stores every discovered query across all sources with a promotion score
    -- and lifecycle status. Promotion is handled by the promote_seeds task.
    CREATE TABLE IF NOT EXISTS seed_candidates (
        id SERIAL PRIMARY KEY,
        query VARCHAR(500) NOT NULL UNIQUE,
        source_seed VARCHAR(255) NOT NULL,
        source VARCHAR(20) NOT NULL DEFAULT 'google',
        query_type VARCHAR(10),
        score BIGINT,
        delta BIGINT,
        promotion_score BIGINT NOT NULL DEFAULT 0,
        status VARCHAR(20) DEFAULT 'pending',
        discovered_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        promoted_at TIMESTAMP WITH TIME ZONE,
        archived_at TIMESTAMP WITH TIME ZONE
    );

    CREATE INDEX IF NOT EXISTS idx_seed_candidates_status ON seed_candidates(status);
    CREATE INDEX IF NOT EXISTS idx_seed_candidates_source ON seed_candidates(source);
    CREATE INDEX IF NOT EXISTS idx_seed_candidates_promotion_score ON seed_candidates(promotion_score);

    -- Table: active_seeds
    -- Source of truth for the active seed set (max enforced by promote_seeds)
    -- origin says where a seed came from: 'trend' (harvested), 'calendar' (a
    -- holiday), 'evergreen' (a standing theme), 'pivot' (a rewritten trend) or
    -- 'event' (an event the curation model added).
    CREATE TABLE IF NOT EXISTS active_seeds (
        id SERIAL PRIMARY KEY,
        query VARCHAR(500) NOT NULL UNIQUE,
        promotion_score BIGINT NOT NULL DEFAULT 0,
        promoted_from_candidate_id INTEGER REFERENCES seed_candidates(id),
        origin VARCHAR(20) NOT NULL DEFAULT 'trend',
        theme VARCHAR(50),
        seasonal_window_end DATE,
        added_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        archived_at TIMESTAMP WITH TIME ZONE
    );

    -- An existing table keeps its shape here, so the columns are added
    -- before anything writes to them.
    ALTER TABLE active_seeds ADD COLUMN IF NOT EXISTS origin VARCHAR(20) NOT NULL DEFAULT 'trend';
    ALTER TABLE active_seeds ADD COLUMN IF NOT EXISTS theme VARCHAR(50);
    ALTER TABLE active_seeds ADD COLUMN IF NOT EXISTS seasonal_window_end DATE;
    CREATE INDEX IF NOT EXISTS idx_active_seeds_origin ON active_seeds(origin);

    -- Starter seeds (fallback seed set for a fresh database)
    INSERT INTO active_seeds (query, promotion_score, origin) VALUES
        ('funny t-shirt', 0, 'evergreen'),
        ('hoodie', 0, 'evergreen'),
        ('gift', 0, 'evergreen'),
        ('socks', 0, 'evergreen'),
        ('leggings', 0, 'evergreen'),
        ('custom mugs', 0, 'evergreen'),
        ('room decor', 0, 'evergreen'),
        ('wall art', 0, 'evergreen'),
        ('mom humor', 0, 'evergreen'),
        ('dad jokes', 0, 'evergreen'),
        ('gym fitness', 0, 'evergreen'),
        ('running', 0, 'evergreen'),
        ('quirky gifts', 0, 'evergreen'),
        ('novelty socks', 0, 'evergreen'),
        ('personalized gifts', 0, 'evergreen')
    ON CONFLICT (query) DO NOTHING;

    -- Table: source_health
    -- Per-source harvest health so the fix loop opens GitHub issues
    -- automatically after repeated failures/empties.
    CREATE TABLE IF NOT EXISTS source_health (
        source VARCHAR(20) PRIMARY KEY,
        consecutive_failures INTEGER NOT NULL DEFAULT 0,
        consecutive_empty INTEGER NOT NULL DEFAULT 0,
        last_error TEXT,
        last_error_at TIMESTAMP WITH TIME ZONE,
        last_success_at TIMESTAMP WITH TIME ZONE,
        issue_open BOOLEAN NOT NULL DEFAULT FALSE,
        last_issue_url TEXT,
        last_issue_number INTEGER,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Table: seed_curation_log
    -- Tracks LLM and calendar seed curation decisions for audit/tuning
    CREATE TABLE IF NOT EXISTS seed_curation_log (
        id SERIAL PRIMARY KEY,
        candidate_id INTEGER REFERENCES seed_candidates(id),
        action VARCHAR(20) NOT NULL,
        reasoning TEXT,
        event_context VARCHAR(100),
        llm_model VARCHAR(100),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_curation_log_action ON seed_curation_log(action);
    CREATE INDEX IF NOT EXISTS idx_curation_log_event ON seed_curation_log(event_context);

    -- Table: seed_product_tags
    -- Tags active seeds with which production methods the design fits.
    CREATE TABLE IF NOT EXISTS seed_product_tags (
        id SERIAL PRIMARY KEY,
        active_seed_id INTEGER NOT NULL REFERENCES active_seeds(id) ON DELETE CASCADE,
        tag VARCHAR(30) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(active_seed_id, tag)
    );

    CREATE INDEX IF NOT EXISTS idx_seed_product_tags_tag ON seed_product_tags(tag);
    CREATE INDEX IF NOT EXISTS idx_seed_product_tags_seed ON seed_product_tags(active_seed_id);

    -- Table: design_briefs
    -- Stores LLM-generated design concepts synthesized from trend signals.
    CREATE TABLE IF NOT EXISTS design_briefs (
        id SERIAL PRIMARY KEY,
        concept TEXT NOT NULL,
        product_type VARCHAR(50) NOT NULL,
        specific_products TEXT[],
        audience TEXT,
        visual_style TEXT,
        confidence INTEGER NOT NULL DEFAULT 0,
        reasoning TEXT,
        llm_model VARCHAR(100),
        batch_id VARCHAR(50),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_design_briefs_product_type ON design_briefs(product_type);
    CREATE INDEX IF NOT EXISTS idx_design_briefs_created_at ON design_briefs(created_at);
    CREATE INDEX IF NOT EXISTS idx_design_briefs_batch_id ON design_briefs(batch_id);

    -- Table: design_brief_sources
    -- Links design briefs to the active seeds that inspired them.
    CREATE TABLE IF NOT EXISTS design_brief_sources (
        id SERIAL PRIMARY KEY,
        brief_id INTEGER NOT NULL REFERENCES design_briefs(id) ON DELETE CASCADE,
        active_seed_id INTEGER NOT NULL REFERENCES active_seeds(id) ON DELETE CASCADE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(brief_id, active_seed_id)
    );

    CREATE INDEX IF NOT EXISTS idx_design_brief_sources_brief ON design_brief_sources(brief_id);
    CREATE INDEX IF NOT EXISTS idx_design_brief_sources_seed ON design_brief_sources(active_seed_id);

    -- Table: fabrication_materials
    -- Local cache of material availability from cost-book, populated via Redis Streams.
    CREATE TABLE IF NOT EXISTS fabrication_materials (
        id SERIAL PRIMARY KEY,
        external_id VARCHAR(100) NOT NULL UNIQUE,
        name VARCHAR(255) NOT NULL,
        brand VARCHAR(100),
        substrate_type VARCHAR(50),
        color VARCHAR(100),
        sizes TEXT[],
        material_composition VARCHAR(255),
        product_type TEXT[],
        sku VARCHAR(100),
        unit_cost DECIMAL(10,2),
        active BOOLEAN NOT NULL DEFAULT TRUE,
        attributes JSONB,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_fab_materials_product_type ON fabrication_materials(product_type);
    CREATE INDEX IF NOT EXISTS idx_fab_materials_active ON fabrication_materials(active);
    CREATE INDEX IF NOT EXISTS idx_fab_materials_external_id ON fabrication_materials(external_id);

    -- Table: app_settings
    -- The settings the operator can change without a redeploy, e.g. which
    -- product types the pipeline produces right now.
    CREATE TABLE IF NOT EXISTS app_settings (
        key TEXT PRIMARY KEY,
        value TEXT NOT NULL,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_by TEXT
    );
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "store-listing.fullname" . }}-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
data:
  migrations.sql: |
    -- Idempotent migration: brings an existing database up to the unified
    -- source-tagged trend store + seed promotion schema. Safe to re-run.

    -- Sync trend_queries/trend_scores to the current schema (add missing columns/width)
    ALTER TABLE trend_queries ADD COLUMN IF NOT EXISTS source VARCHAR(20) NOT NULL DEFAULT 'google';
    ALTER TABLE trend_scores ADD COLUMN IF NOT EXISTS query_type VARCHAR(10) DEFAULT 'interest';
    ALTER TABLE trend_scores ADD COLUMN IF NOT EXISTS source VARCHAR(20) NOT NULL DEFAULT 'google';
    ALTER TABLE trend_scores ADD COLUMN IF NOT EXISTS trend_direction INTEGER;
    ALTER TABLE trend_scores ALTER COLUMN region TYPE VARCHAR(255);

    -- Table: seed_candidates
    CREATE TABLE IF NOT EXISTS seed_candidates (
        id SERIAL PRIMARY KEY,
        query VARCHAR(500) NOT NULL UNIQUE,
        source_seed VARCHAR(255) NOT NULL,
        source VARCHAR(20) NOT NULL DEFAULT 'google',
        query_type VARCHAR(10),
        score BIGINT,
        delta BIGINT,
        promotion_score BIGINT NOT NULL DEFAULT 0,
        status VARCHAR(20) DEFAULT 'pending',
        discovered_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        promoted_at TIMESTAMP WITH TIME ZONE,
        archived_at TIMESTAMP WITH TIME ZONE
    );

    CREATE INDEX IF NOT EXISTS idx_seed_candidates_status ON seed_candidates(status);
    CREATE INDEX IF NOT EXISTS idx_seed_candidates_source ON seed_candidates(source);
    CREATE INDEX IF NOT EXISTS idx_seed_candidates_promotion_score ON seed_candidates(promotion_score);

    -- Table: active_seeds
    CREATE TABLE IF NOT EXISTS active_seeds (
        id SERIAL PRIMARY KEY,
        query VARCHAR(500) NOT NULL UNIQUE,
        promotion_score BIGINT NOT NULL DEFAULT 0,
        promoted_from_candidate_id INTEGER REFERENCES seed_candidates(id),
        added_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        archived_at TIMESTAMP WITH TIME ZONE
    );

    -- Seed origin: where a seed came from. Without it the pool cannot tell a
    -- holiday seed from a standing theme, and the season takes it over.
    -- The columns are added before the starter seeds are written, because
    -- the insert below names them.
    ALTER TABLE active_seeds ADD COLUMN IF NOT EXISTS origin VARCHAR(20) NOT NULL DEFAULT 'trend';
    ALTER TABLE active_seeds ADD COLUMN IF NOT EXISTS theme VARCHAR(50);
    ALTER TABLE active_seeds ADD COLUMN IF NOT EXISTS seasonal_window_end DATE;
    CREATE INDEX IF NOT EXISTS idx_active_seeds_origin ON active_seeds(origin);

    -- Starter seeds (fallback seed set for a fresh database)
    INSERT INTO active_seeds (query, promotion_score, origin) VALUES
        ('funny t-shirt', 0, 'evergreen'),
        ('hoodie', 0, 'evergreen'),
        ('gift', 0, 'evergreen'),
        ('socks', 0, 'evergreen'),
        ('leggings', 0, 'evergreen'),
        ('custom mugs', 0, 'evergreen'),
        ('room decor', 0, 'evergreen'),
        ('wall art', 0, 'evergreen'),
        ('mom humor', 0, 'evergreen'),
        ('dad jokes', 0, 'evergreen'),
        ('gym fitness', 0, 'evergreen'),
        ('running', 0, 'evergreen'),
        ('quirky gifts', 0, 'evergreen'),
        ('novelty socks', 0, 'evergreen'),
        ('personalized gifts', 0, 'evergreen')
    ON CONFLICT (query) DO NOTHING;

    -- The starter seeds are evergreen themes, not trends.
    UPDATE active_seeds
    SET origin = 'evergreen'
    WHERE origin = 'trend'
      AND promoted_from_candidate_id IS NULL
      AND query IN (
          'funny t-shirt', 'hoodie', 'gift', 'socks', 'leggings', 'custom mugs',
          'room decor', 'wall art', 'mom humor', 'dad jokes', 'gym fitness',
          'running', 'quirky gifts', 'novelty socks', 'personalized gifts'
      );

    -- Widen score/delta/promotion_score to BIGINT for YouTube view counts
    ALTER TABLE trend_scores ALTER COLUMN score TYPE BIGINT;
    ALTER TABLE trend_scores ALTER COLUMN delta TYPE BIGINT;
    ALTER TABLE seed_candidates ALTER COLUMN score TYPE BIGINT;
    ALTER TABLE seed_candidates ALTER COLUMN delta TYPE BIGINT;
    ALTER TABLE seed_candidates ALTER COLUMN promotion_score TYPE BIGINT;
    ALTER TABLE active_seeds ALTER COLUMN promotion_score TYPE BIGINT;

    -- Table: source_health (health tracker for auto-created GitHub issues)
    CREATE TABLE IF NOT EXISTS source_health (
        source VARCHAR(20) PRIMARY KEY,
        consecutive_failures INTEGER NOT NULL DEFAULT 0,
        consecutive_empty INTEGER NOT NULL DEFAULT 0,
        last_error TEXT,
        last_error_at TIMESTAMP WITH TIME ZONE,
        last_success_at TIMESTAMP WITH TIME ZONE,
        issue_open BOOLEAN NOT NULL DEFAULT FALSE,
        last_issue_url TEXT,
        last_issue_number INTEGER,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Table: seed_curation_log (LLM + calendar curation audit trail)
    CREATE TABLE IF NOT EXISTS seed_curation_log (
        id SERIAL PRIMARY KEY,
        candidate_id INTEGER REFERENCES seed_candidates(id),
        action VARCHAR(20) NOT NULL,
        reasoning TEXT,
        event_context VARCHAR(100),
        llm_model VARCHAR(100),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_curation_log_action ON seed_curation_log(action);
    CREATE INDEX IF NOT EXISTS idx_curation_log_event ON seed_curation_log(event_context);

    -- Table: seed_product_tags (production method tagging for phased rollout)
    CREATE TABLE IF NOT EXISTS seed_product_tags (
        id SERIAL PRIMARY KEY,
        active_seed_id INTEGER NOT NULL REFERENCES active_seeds(id) ON DELETE CASCADE,
        tag VARCHAR(30) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(active_seed_id, tag)
    );

    CREATE INDEX IF NOT EXISTS idx_seed_product_tags_tag ON seed_product_tags(tag);
    CREATE INDEX IF NOT EXISTS idx_seed_product_tags_seed ON seed_product_tags(active_seed_id);

    -- Table: design_briefs (LLM-generated design concepts)
    CREATE TABLE IF NOT EXISTS design_briefs (
        id SERIAL PRIMARY KEY,
        concept TEXT NOT NULL,
        product_type VARCHAR(50) NOT NULL,
        specific_products TEXT[],
        audience TEXT,
        visual_style TEXT,
        confidence INTEGER NOT NULL DEFAULT 0,
        reasoning TEXT,
        llm_model VARCHAR(100),
        batch_id VARCHAR(50),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_design_briefs_product_type ON design_briefs(product_type);
    CREATE INDEX IF NOT EXISTS idx_design_briefs_created_at ON design_briefs(created_at);
    CREATE INDEX IF NOT EXISTS idx_design_briefs_batch_id ON design_briefs(batch_id);

    -- Table: design_brief_sources (brief-to-seed linkage)
    CREATE TABLE IF NOT EXISTS design_brief_sources (
        id SERIAL PRIMARY KEY,
        brief_id INTEGER NOT NULL REFERENCES design_briefs(id) ON DELETE CASCADE,
        active_seed_id INTEGER NOT NULL REFERENCES active_seeds(id) ON DELETE CASCADE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(brief_id, active_seed_id)
    );

    CREATE INDEX IF NOT EXISTS idx_design_brief_sources_brief ON design_brief_sources(brief_id);
    CREATE INDEX IF NOT EXISTS idx_design_brief_sources_seed ON design_brief_sources(active_seed_id);

    -- Add image storage and text layout columns to design_briefs
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS image_key_raw TEXT;
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS image_key_transparent TEXT;
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS layout_type VARCHAR(30) DEFAULT 'full_bleed';
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS headline_text TEXT;
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS tagline_text TEXT;
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS font_color VARCHAR(20);
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS regeneration_feedback TEXT;
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS scene_description TEXT;
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS personal_use BOOLEAN NOT NULL DEFAULT FALSE;
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS original_confidence INTEGER;
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS last_reranked_at TIMESTAMP WITH TIME ZONE;

    -- Table: fabrication_materials (local cache of cost-book material availability)
    CREATE TABLE IF NOT EXISTS fabrication_materials (
        id SERIAL PRIMARY KEY,
        external_id VARCHAR(100) NOT NULL UNIQUE,
        name VARCHAR(255) NOT NULL,
        brand VARCHAR(100),
        substrate_type VARCHAR(50),
        color VARCHAR(100),
        sizes TEXT[],
        material_composition VARCHAR(255),
        product_type TEXT[],
        sku VARCHAR(100),
        unit_cost DECIMAL(10,2),
        active BOOLEAN NOT NULL DEFAULT TRUE,
        attributes JSONB,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_fab_materials_product_type ON fabrication_materials(product_type);
    CREATE INDEX IF NOT EXISTS idx_fab_materials_active ON fabrication_materials(active);
    CREATE INDEX IF NOT EXISTS idx_fab_materials_external_id ON fabrication_materials(external_id);

    -- cost-book publishes substrate_type and product_type only when the material
    -- carries them, so both columns have to accept a null.
    ALTER TABLE fabrication_materials ALTER COLUMN substrate_type DROP NOT NULL;
    ALTER TABLE fabrication_materials ALTER COLUMN product_type DROP NOT NULL;

    -- cost-book publishes the product types a material can serve as a JSON
    -- array, so the column holds the array and a filter matches any of them
    -- (issue #186). The old value was the raw JSON text, which does not cast,
    -- and the table is a cache: it is refilled from the stream. The conversion
    -- only runs while the column is not an array yet, so a redeploy does not
    -- empty it again.
    DO $$
    BEGIN
        IF EXISTS (
            SELECT 1 FROM information_schema.columns
            WHERE table_name = 'fabrication_materials'
              AND column_name = 'product_type'
              AND data_type <> 'ARRAY'
        ) THEN
            UPDATE fabrication_materials SET product_type = NULL;
            ALTER TABLE fabrication_materials
                ALTER COLUMN product_type TYPE TEXT[] USING NULL::TEXT[];
        END IF;
    END $$;

    -- Add recommended_materials to design_briefs
    ALTER TABLE design_briefs ADD COLUMN IF NOT EXISTS recommended_materials JSONB;

    -- Table: app_settings (the settings the operator can change without a
    -- redeploy, e.g. which product types the pipeline produces)
    CREATE TABLE IF NOT EXISTS app_settings (
        key TEXT PRIMARY KEY,
        value TEXT NOT NULL,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_by TEXT
    );

    -- Migration: split 'marketplace' source_health into 'amazon' and 'etsy'
    DELETE FROM source_health WHERE source = 'marketplace';