kind: Secret
apiVersion: v1
metadata:
  name: {{ include "store-listing.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
stringData:
  POSTGRESQL_USER: {{ .Values.secrets.databaseUser | quote }}
  POSTGRESQL_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  DATABASE_USER: {{ .Values.secrets.databaseUser | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  JWT_ISSUER: {{ .Values.secrets.jwtIssuer | quote }}
  APIFY_API_TOKEN: {{ .Values.secrets.apifyApiToken | default "" | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | default "" | quote }}
  YOUTUBE_API_KEY: {{ .Values.secrets.youtubeApiKey | default "" | quote }}
  ETSY_API_KEY: {{ .Values.secrets.etsyApiKey | default "" | quote }}
  REDDIT_CLIENT_ID: {{ .Values.secrets.redditClientId | default "" | quote }}
  REDDIT_CLIENT_SECRET: {{ .Values.secrets.redditClientSecret | default "" | quote }}
