apiVersion: v1
kind: Service
metadata:
  name: {{ include "store-listing.trend-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
    app.kubernetes.io/component: trend-service
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    {{- include "store-listing.trend-service.selectorLabels" . | nindent 4 }}
