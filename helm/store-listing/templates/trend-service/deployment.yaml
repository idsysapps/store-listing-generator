apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store-listing.trend-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
    app.kubernetes.io/component: trend-service
spec:
  replicas: {{ .Values.trendService.replicas }}
  selector:
    matchLabels:
      {{- include "store-listing.trend-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store-listing.labels" . | nindent 8 }}
        {{- include "store-listing.trend-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: trend-service
          image: {{ .Values.trendService.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_PASSWORD
            - name: JWT_PUBLICKEY_LOCATION
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: JWT_PUBLICKEY_LOCATION
            - name: JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: JWT_ISSUER
            - name: QUARKUS_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: QUARKUS_PROFILE
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            - name: QUARKUS_HTTP_PORT
              value: "8081"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.trendService.resources | nindent 12 }}
