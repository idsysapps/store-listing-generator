apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store-listing.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "store-listing.redis.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "store-listing.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
        app.kubernetes.io/name: {{ include "store-listing.redis.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1000880000
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args:
            - --bind
            - 0.0.0.0
            - --protected-mode
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          {{- if .Values.redis.persistentVolumeClaim.create }}
          persistentVolumeClaim:
            claimName: {{ include "store-listing.redis.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
