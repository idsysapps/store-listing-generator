apiVersion: v1
kind: Service
metadata:
  name: {{ include "store-listing.app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "store-listing.app.selectorLabels" . | nindent 4 }}
