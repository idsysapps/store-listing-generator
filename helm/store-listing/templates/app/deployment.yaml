apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store-listing.app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "store-listing.app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store-listing.labels" . | nindent 8 }}
        {{- include "store-listing.app.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        # The schema migration runs as a post-upgrade hook, so a new pod can
        # start before the columns are there. The pod waits for them instead
        # of failing its first query, and it never waits longer than the
        # timeout inside the script.
        - name: wait-for-schema
          image: {{ .Values.app.image }}
          imagePullPolicy: Always
          command: ["python", "-m", "store_listing.db.wait_for_schema"]
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_PASSWORD
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      containers:
        - name: celery-worker
          image: {{ .Values.app.image }}
          imagePullPolicy: Always
          args:
            - celery
            - -A
            - store_listing.orchestration.tasks
            - worker
            - --loglevel=info
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: REDIS_URL
            - name: APIFY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: APIFY_API_TOKEN
            - name: APIFY_ACTOR_TIKTOK_HASHTAG
              value: {{ .Values.config.tiktokActorId | default "" | quote }}
            - name: APIFY_ACTOR_PINTEREST
              value: {{ .Values.config.pinterestActorId | default "" | quote }}
            - name: ETSY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: ETSY_API_KEY
            - name: APIFY_ACTOR_X
              value: {{ .Values.config.xActorId | default "" | quote }}
            - name: TIKTOK_RESULTS_PER_PAGE
              value: {{ .Values.config.tiktokResultsPerPage | default 20 | quote }}
            - name: SOURCE_HEALTH_ENABLED
              value: {{ .Values.config.sourceHealthEnabled | default true | quote }}
            - name: HEALTH_FAILURE_THRESHOLD
              value: {{ .Values.config.healthFailureThreshold | default 2 | quote }}
            - name: HEALTH_EMPTY_THRESHOLD
              value: {{ .Values.config.healthEmptyThreshold | default 3 | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.config.githubRepo | default "" | quote }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: GITHUB_TOKEN
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: YOUTUBE_API_KEY
            - name: REDDIT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: REDDIT_CLIENT_ID
            - name: REDDIT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: REDDIT_CLIENT_SECRET
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: LLM_API_KEY
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_BASE_URL
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_MODEL
            - name: LLM_CURATION_MODEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_CURATION_MODEL
            - name: LLM_SEED_CURATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_SEED_CURATION_ENABLED
            - name: LLM_DESIGN_BRIEFS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_DESIGN_BRIEFS_ENABLED
            - name: LLM_MAX_CANDIDATES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_MAX_CANDIDATES
            - name: LLM_MAX_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_MAX_TOKENS
            {{- if .Values.config.enabledProductTypes }}
            - name: ENABLED_PRODUCT_TYPES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: ENABLED_PRODUCT_TYPES
            {{- end }}
            - name: LLM_CURATION_SCHEDULE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_CURATION_SCHEDULE
            - name: LLM_CURATION_MAX_CHAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_CURATION_MAX_CHAIN
            - name: LLM_CURATION_CHAIN_DELAY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_CURATION_CHAIN_DELAY
            - name: LLM_BRIEFS_SCHEDULE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_BRIEFS_SCHEDULE
            - name: LLM_IMAGE_GEN_SCHEDULE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_IMAGE_GEN_SCHEDULE
            - name: LLM_RERANK_SCHEDULE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: LLM_RERANK_SCHEDULE
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.config.awsDefaultRegion | default "us-west-2" | quote }}
            - name: COMFYUI_BASE_URL
              value: {{ .Values.config.comfyuiBaseUrl | default "http://comfyui:8188" | quote }}
            - name: COMFYUI_TIMEOUT_SECONDS
              value: {{ .Values.config.comfyuiTimeoutSeconds | default "300" | quote }}
            - name: COMFYUI_BG_ALPHA_BLACK
              value: {{ .Values.config.comfyuiBgAlphaBlack | default "24" | quote }}
            - name: COMFYUI_BG_ALPHA_WHITE
              value: {{ .Values.config.comfyuiBgAlphaWhite | default "240" | quote }}
            - name: COMFYUI_BG_ERODE_PIXELS
              value: {{ .Values.config.comfyuiBgErodePixels | default "1" | quote }}
            - name: COMFYUI_STEPS
              value: {{ .Values.config.comfyuiSteps | default "4" | quote }}
            - name: COMFYUI_CFG
              value: {{ .Values.config.comfyuiCfg | default "1.0" | quote }}
            - name: TYPOGRAPHIC_HERO_ENABLED
              value: {{ .Values.config.typographicHeroEnabled | default "0" | quote }}
            - name: TYPOGRAPHIC_HERO_BRIEF_IDS
              value: {{ .Values.config.typographicHeroBriefIds | default "" | quote }}
            - name: TYPOGRAPHIC_HERO_CANDIDATES
              value: {{ .Values.config.typographicHeroCandidates | default "2" | quote }}
            - name: TYPOGRAPHIC_HERO_DESCRIPTOR
              value: {{ .Values.config.typographicHeroDescriptor | default "1" | quote }}
            - name: VISION_LLM_BASE_URL
              value: {{ .Values.config.visionLlmBaseUrl | default "" | quote }}
            - name: VISION_LLM_MODEL
              value: {{ .Values.config.visionLlmModel | default "qwen_vl_ocr" | quote }}
            - name: ARTWORK_VISION_MODEL
              value: {{ .Values.config.artworkVisionModel | default "" | quote }}
            - name: VISION_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: VISION_LLM_API_KEY
            - name: TEXT_MATCH_THRESHOLD
              value: {{ .Values.config.textMatchThreshold | default "0.85" | quote }}
            - name: MAX_TEXT_REGENERATION_ATTEMPTS
              value: {{ .Values.config.maxTextRegenerationAttempts | default "2" | quote }}
            - name: MAX_ARTWORK_REGENERATION_ATTEMPTS
              value: {{ .Values.config.maxArtworkRegenerationAttempts | default "1" | quote }}
            - name: ARTWORK_VALIDATION_ENABLED
              value: {{ .Values.config.artworkValidationEnabled | default "true" | quote }}
            - name: ARTWORK_TEXT_VALIDATION_ENABLED
              value: {{ .Values.config.artworkTextValidationEnabled | default "true" | quote }}
            - name: MAX_LETTERING_REGENERATION_ATTEMPTS
              value: {{ .Values.config.maxLetteringRegenerationAttempts | default "1" | quote }}
            - name: REQUIRE_TAGLINE_TEXT
              value: {{ .Values.config.requireTaglineText | default "false" | quote }}
            - name: DESIGN_S3_BUCKET
              value: {{ .Values.config.designS3Bucket | default "store-listing-designs" | quote }}
            {{- if .Values.config.s3EndpointUrl }}
            - name: S3_ENDPOINT_URL
              value: {{ .Values.config.s3EndpointUrl | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
        - name: celery-beat
          image: {{ .Values.app.image }}
          imagePullPolicy: Always
          args:
            - celery
            - -A
            - store_listing.orchestration.tasks
            - beat
            - --loglevel=info
            - --schedule=/tmp/celerybeat-schedule
