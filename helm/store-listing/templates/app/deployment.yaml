apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store-listing.app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "store-listing.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "store-listing.app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store-listing.labels" . | nindent 8 }}
        {{- include "store-listing.app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: celery-worker
          image: {{ .Values.app.image }}
          imagePullPolicy: Always
          args:
            - celery
            - -A
            - store_listing.orchestration.tasks
            - worker
            - --loglevel=info
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: REDIS_URL
            - name: APIFY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: APIFY_API_TOKEN
            - name: APIFY_ACTOR_TIKTOK_HASHTAG
              value: {{ .Values.config.tiktokActorId | default "" | quote }}
            - name: APIFY_ACTOR_PINTEREST
              value: {{ .Values.config.pinterestActorId | default "" | quote }}
            - name: ETSY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: ETSY_API_KEY
            - name: APIFY_ACTOR_X
              value: {{ .Values.config.xActorId | default "" | quote }}
            - name: TIKTOK_RESULTS_PER_PAGE
              value: {{ .Values.config.tiktokResultsPerPage | default 20 | quote }}
            - name: SOURCE_HEALTH_ENABLED
              value: {{ .Values.config.sourceHealthEnabled | default true | quote }}
            - name: HEALTH_FAILURE_THRESHOLD
              value: {{ .Values.config.healthFailureThreshold | default 2 | quote }}
            - name: HEALTH_EMPTY_THRESHOLD
              value: {{ .Values.config.healthEmptyThreshold | default 3 | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.config.githubRepo | default "" | quote }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: GITHUB_TOKEN
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: YOUTUBE_API_KEY
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
        - name: celery-beat
          image: {{ .Values.app.image }}
          imagePullPolicy: Always
          args:
            - celery
            - -A
            - store_listing.orchestration.tasks
            - beat
            - --loglevel=info
            - --schedule=/tmp/celerybeat-schedule
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: DATABASE_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "store-listing.fullname" . }}-config
                  key: REDIS_URL
            - name: APIFY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: APIFY_API_TOKEN
            - name: APIFY_ACTOR_TIKTOK_HASHTAG
              value: {{ .Values.config.tiktokActorId | default "" | quote }}
            - name: APIFY_ACTOR_PINTEREST
              value: {{ .Values.config.pinterestActorId | default "" | quote }}
            - name: ETSY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: ETSY_API_KEY
            - name: APIFY_ACTOR_X
              value: {{ .Values.config.xActorId | default "" | quote }}
            - name: TIKTOK_RESULTS_PER_PAGE
              value: {{ .Values.config.tiktokResultsPerPage | default 20 | quote }}
            - name: SOURCE_HEALTH_ENABLED
              value: {{ .Values.config.sourceHealthEnabled | default true | quote }}
            - name: HEALTH_FAILURE_THRESHOLD
              value: {{ .Values.config.healthFailureThreshold | default 2 | quote }}
            - name: HEALTH_EMPTY_THRESHOLD
              value: {{ .Values.config.healthEmptyThreshold | default 3 | quote }}
            - name: GITHUB_REPO
              value: {{ .Values.config.githubRepo | default "" | quote }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: GITHUB_TOKEN
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "store-listing.fullname" . }}-secrets
                  key: YOUTUBE_API_KEY
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
